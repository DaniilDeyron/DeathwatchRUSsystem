name: Build and publish Deathwatch RU

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (example: v0.0.2-ru.10)"
        required: true
        default: "v0.0.2-ru.10"
        type: string
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    if: github.event_name != 'push' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, '[build-ru]')
    concurrency:
      group: deathwatch-ru-build-publish
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Deathwatch RU builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const status of ["queued", "in_progress"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, status, per_page: 100
              });
              for (const run of runs) {
                if (run.id === context.runId) continue;
                if (run.name !== "Build and publish Deathwatch RU") continue;
                core.info(`Canceling stale run ${run.id} (${run.status})`);
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                } catch (error) {
                  core.warning(`Could not cancel run ${run.id}: ${error.message}`);
                }
              }
            }

      - name: Checkout translation repository
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout upstream build scripts
        uses: actions/checkout@v4
        with:
          repository: cec-software/deathwatch_foundryvtt
          ref: main
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: upstream/.cache/translation-cache.json
          key: deathwatch-ru-translations-${{ github.sha }}
          restore-keys: |
            deathwatch-ru-translations-

      - name: Prepare source tree and build compendiums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src
          mkdir -p upstream/src
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README_RU.md' self/ upstream/src/

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifestPath = 'upstream/src/system.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.id = 'deathwatch-ru';
          manifest.title = 'Warhammer 40,000: Deathwatch — Русская версия';
          manifest.version = '0.0.2-ru.10';
          manifest.url = 'https://github.com/DaniilDeyron/DeathwatchRUSsystem';
          manifest.manifest = 'https://raw.githubusercontent.com/DaniilDeyron/DeathwatchRUSsystem/main/system.json';
          manifest.download = 'https://github.com/DaniilDeyron/DeathwatchRUSsystem/releases/latest/download/deathwatch-ru.zip';
          for (const pack of manifest.packs ?? []) pack.system = 'deathwatch-ru';
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const entryPath = 'upstream/src/module/deathwatch.mjs';
          let entry = fs.readFileSync(entryPath, 'utf8');
          entry = entry.replaceAll('registerSheet("deathwatch",', 'registerSheet("deathwatch-ru",');
          fs.writeFileSync(entryPath, entry);
          NODE

          python upstream/src/scripts/translate_ru.py upstream/src
          cd upstream
          npm install
          npm run build:packs

      - name: Package installable system
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/deathwatch-ru
          rsync -a --exclude='/packs-source/' --exclude='/scripts/' --exclude='/README_RU.md' --exclude='*.test.mjs' upstream/src/ dist/deathwatch-ru/
          (cd dist/deathwatch-ru && zip -qr ../../deathwatch-ru.zip .)
          ls -lh deathwatch-ru.zip

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag_name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            echo "tag_name=v0.0.2-ru.10" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Deathwatch RU ${{ steps.tag.outputs.tag_name }}
          body: |
            Автоматически собранная версия системы Deathwatch RU для Foundry VTT.
            Включает скомпилированные компендиумы и расширенную локализацию интерфейса/контента. Значения игровых механик сохраняются; машинный перевод требует терминологической и игровой проверки.
          files: deathwatch-ru.zip
          generate_release_notes: true
          make_latest: true

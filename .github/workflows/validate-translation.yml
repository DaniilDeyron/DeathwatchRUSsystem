name: Validate Russian localization script

on:
  push:
    branches: [main]
    paths:
      - "scripts/translate_ru.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/validate-translation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/translate_ru.py
      - name: Validate regular expressions
        run: python scripts/translate_ru.py . --validate
      - name: Reject unsafe global backtick processing
        run: |
          ! grep -Fq "ALL_TICK.sub" scripts/translate_ru.py
          ! grep -Fq "JS_HTML_DQ" scripts/translate_ru.py
          ! grep -Fq "JS_HTML_SQ" scripts/translate_ru.py
          grep -Fq "def encode_js_string" scripts/translate_ru.py
          grep -Fq "def translate_template_content" scripts/translate_ru.py

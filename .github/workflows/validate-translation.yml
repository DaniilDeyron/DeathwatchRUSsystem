name: Validate Russian localization script

on:
  push:
    branches: [main]
    paths:
      - "scripts/translate_ru.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/validate-translation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/translate_ru.py
      - name: Validate regular expressions
        run: python scripts/translate_ru.py . --validate

name: Test translation endpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-translation-endpoint.yml"

permissions:
  contents: read

jobs:
  test-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google Translate endpoint
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, time
          url = "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode({
              "client": "gtx", "sl": "en", "tl": "ru", "dt": "t",
              "q": "Awareness\\nZXQSEP98371QXZ\\nCarouse\\nZXQSEP98371QXZ\\nA Devourer is a living weapon."
          })
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          started = time.time()
          with urllib.request.urlopen(req, timeout=12) as response:
              data = json.loads(response.read().decode("utf-8"))
          text = "".join(seg[0] for seg in data[0] if isinstance(seg, list) and seg and isinstance(seg[0], str))
          print("Response in %.2f seconds" % (time.time() - started))
          print("Translated text:", text)
          print("Sentinel preserved:", text.count("ZXQSEP98371QXZ"))
          assert text and text.count("ZXQSEP98371QXZ") == 2, "The endpoint did not preserve batch separators"
          PY